<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Milano 2026 🎸 — Rejseguide & Kort</title>
  <meta name="description" content="Eksklusiv mobil-guide til Milano 2026: Hotel ibis, Rock & live musik, vinyl, ølbarer, retro & loppemarkeder samt TikTok hotspots.">
  <meta name="theme-color" content="#0E0E12">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Google Fonts: Space Grotesk & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Custom Styles (cache busted) -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="dark-theme">
  <div class="app-wrapper">
    <!-- Top Header -->
    <header class="top-header">
      <div class="header-main">
        <div class="brand">
          <img src="assets/avatar_1.png" alt="Rejsende 1" class="header-avatar header-avatar-left" title="Milano 2026 Crew">
          <div class="brand-text">
            <h1>Milano 2026</h1>
            <span class="subtitle">Base: Hotel ibis Milano Centro</span>
          </div>
          <img src="assets/avatar_2.png" alt="Rejsende 2" class="header-avatar header-avatar-right" title="Milano 2026 Crew">
        </div>
        <div class="header-stats">
          <button id="btn-force-refresh" class="btn-refresh-pill" title="Tving opdatering af appen" aria-label="Opdater app">
            <span>🔄</span>
          </button>
          <span id="cloud-status-pill" class="cloud-status-pill" title="Live gruppesynkronisering i skyen (uden login)">
            <span class="live-dot"></span>
            <span class="cloud-label">Live synk</span>
          </span>
          <span id="visited-counter-pill" class="visited-counter-pill" title="Steder I har besøgt">
            ⭐ <span id="visited-count">0</span> set
          </span>
        </div>
      </div>

      <!-- Søgefelt -->
      <div class="search-bar-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Søg i spots, vinyl, loppemarked, øl..." autocomplete="off">
        <button id="clear-search" class="clear-btn" aria-label="Ryd søgning">&times;</button>
      </div>

      <!-- Kategori Filter Chips -->
      <nav class="filter-carousel" aria-label="Kategorier">
        <button class="filter-chip active" data-category="all">
          <span class="chip-icon">⚡</span>
          <span class="chip-label">Alle Spots</span>
          <span class="chip-count" id="count-all">0</span>
        </button>

        <button class="filter-chip chip-want" data-category="want">
          <span class="chip-icon">❤️</span>
          <span class="chip-label">Vil besøge</span>
          <span class="chip-count" id="count-want">0</span>
        </button>

        <button class="filter-chip chip-rock" data-category="rock">
          <span class="chip-icon">🎸</span>
          <span class="chip-label">Rock & Musik</span>
          <span class="chip-count" id="count-rock">0</span>
        </button>

        <button class="filter-chip chip-vinyl" data-category="vinyl">
          <span class="chip-icon">🎵</span>
          <span class="chip-label">Vinyl & Plader</span>
          <span class="chip-count" id="count-vinyl">0</span>
        </button>

        <button class="filter-chip chip-beer" data-category="beer">
          <span class="chip-icon">🍺</span>
          <span class="chip-label">Ølbarer</span>
          <span class="chip-count" id="count-beer">0</span>
        </button>

        <button class="filter-chip chip-vintage" data-category="vintage">
          <span class="chip-icon">👗</span>
          <span class="chip-label">Retro & Vintage</span>
          <span class="chip-count" id="count-vintage">0</span>
        </button>

        <button class="filter-chip chip-market" data-category="market">
          <span class="chip-icon">🛍️</span>
          <span class="chip-label">Loppemarkeder</span>
          <span class="chip-count" id="count-market">0</span>
        </button>

        <button class="filter-chip chip-food" data-category="food">
          <span class="chip-icon">🍷</span>
          <span class="chip-label">Mad & Vin</span>
          <span class="chip-count" id="count-food">0</span>
        </button>

        <button class="filter-chip chip-sight" data-category="sight">
          <span class="chip-icon">🏛️</span>
          <span class="chip-label">Monumenter</span>
          <span class="chip-count" id="count-sight">0</span>
        </button>

        <button class="filter-chip chip-viral" data-category="viral">
          <span class="chip-icon">📱</span>
          <span class="chip-label">TikTok & Insta</span>
          <span class="chip-count" id="count-viral">0</span>
        </button>

        <button class="filter-chip chip-visited" data-category="visited">
          <span class="chip-icon">⭐</span>
          <span class="chip-label">Besøgt</span>
          <span class="chip-count" id="count-visited">0</span>
        </button>
      </nav>
    </header>

    <!-- Hovedindhold -->
    <main class="app-layout">
      <!-- Sidebar / Listevisning -->
      <section class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title-row">
            <span class="sidebar-title" id="filter-title-label">Alle Spots i Milano</span>
            <span class="sidebar-count" id="active-count-label">0 steder</span>
          </div>
        </div>

        <div class="places-list" id="places-list">
          <!-- Dynamisk indhold fra app.js -->
        </div>
      </section>

      <!-- Kortsektion -->
      <section class="map-container" id="map-container">
        <div id="map"></div>

        <!-- Flydende genvejsknapper på kortet -->
        <div class="map-floating-controls">
          <button id="btn-show-hotel" class="fab-btn fab-hotel" title="Vis Hotel ibis Milano Centro (Hovedbase)">
            <span>🏨</span>
            <span class="fab-label">Hotel ibis</span>
          </button>
          <button id="btn-show-duomo" class="fab-btn" title="Find Duomo di Milano">
            <span>🏛️</span>
            <span class="fab-label">Duomo</span>
          </button>
          <button id="btn-recenter" class="fab-btn" title="Centrér over Milano">
            <span>🎯</span>
            <span class="fab-label">Centrér</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Mobil Bundmenu (Skift mellem Kort og Liste) -->
    <nav class="mobile-nav-bar">
      <button id="nav-btn-map" class="mobile-nav-btn active">
        <span class="nav-icon">🗺️</span>
        <span>Kortvisning</span>
      </button>
      <button id="nav-btn-list" class="mobile-nav-btn">
        <span class="nav-icon">📋</span>
        <span>Stedliste (<span id="mobile-list-count">0</span>)</span>
      </button>
    </nav>

    <!-- Automatisk Opdaterings-Toast -->
    <div id="update-toast" class="update-toast">
      <div class="toast-content">
        <span class="toast-icon">🚀</span>
        <span class="toast-text">Ny opdatering til Milano 2026!</span>
      </div>
      <button id="btn-toast-reload" class="btn-toast-reload">Opdater nu</button>
    </div>

    <!-- Detalje Modal / Bottom Sheet -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="detail-modal" id="detail-modal" role="dialog" aria-modal="true">
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Luk modal">&times;</button>
        <div class="modal-body" id="modal-body">
          <!-- Dynamisk indhold indsættes her -->
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- App JS (cache busted) -->
  <script src="app.js?v=8"></script>
</body>
</html>
