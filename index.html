<!DOCTYPE html>
<html lang="da" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Milano Vennetur 🤘 – Rejseguide</title>
  <meta name="description" content="Milano Vennetur guide: Rock, monumenter, TikTok spots og vores hotel basecamp.">
  <meta name="theme-color" content="#0d0f12">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rock: '#ef4444',
            monument: '#3b82f6',
            tiktok: '#ec4899',
            hotel: '#f59e0b',
            visited: '#10b981',
            darkbg: '#0c0d10',
            darksurface: '#161920',
            darkcard: '#1d212b',
            darkborder: '#2c3240'
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Google Fonts: Inter & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-darkbg text-gray-100 font-sans antialiased min-h-screen flex flex-col selection:bg-red-500 selection:text-white">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-40 bg-darksurface/95 backdrop-blur-md border-b border-darkborder px-4 py-3 shrink-0">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-amber-500 flex items-center justify-center text-lg shadow-lg shadow-red-500/20">
          🤘
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight font-display text-white leading-tight flex items-center gap-1.5">
            Milano Vennetur
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 font-mono font-bold tracking-wider uppercase">2026</span>
          </h1>
          <p class="text-[11px] text-gray-400 leading-none">Rock · Seværdigheder · TikTok · Basecamp</p>
        </div>
      </div>

      <!-- View switcher desktop & stats -->
      <div class="flex items-center gap-2">
        <button id="hotel-shortcut" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/15 text-amber-400 border border-amber-500/30 text-xs font-semibold hover:bg-amber-500/25 transition">
          🏨 Basecamp
        </button>
        <div class="bg-darkcard border border-darkborder rounded-xl p-0.5 flex text-xs font-semibold">
          <button id="btn-view-map" class="px-3 py-1.5 rounded-lg bg-red-600 text-white shadow-sm flex items-center gap-1 transition">
            <span>🗺️</span> Kort
          </button>
          <button id="btn-view-list" class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white flex items-center gap-1 transition">
            <span>📋</span> Liste
          </button>
        </div>
      </div>
    </div>

    <!-- Search & Quick Filters -->
    <div class="max-w-5xl mx-auto mt-2.5 space-y-2">
      <!-- Search Input -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 text-sm">
          🔍
        </span>
        <input 
          id="search-input" 
          type="search" 
          placeholder="Søg spots, spillesteder, dumplings, kranier..." 
          class="w-full bg-darkcard border border-darkborder rounded-xl pl-9 pr-8 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition"
        >
        <button id="search-clear" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-200 text-xs">
          ✕
        </button>
      </div>

      <!-- Category Filter Pills (Mobile Horizontal Scrollable) -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
        <button data-cat="all" class="cat-pill active px-3 py-1.5 rounded-full font-bold bg-white text-gray-900 border border-white whitespace-nowrap transition shadow-sm">
          Alle (15)
        </button>
        <button data-cat="hotel" class="cat-pill px-3 py-1.5 rounded-full font-semibold bg-darkcard text-amber-400 border border-darkborder hover:border-amber-500/50 whitespace-nowrap transition">
          🏨 Basecamp
        </button>
        <button data-cat="rock" class="cat-pill px-3 py-1.5 rounded-full font-semibold bg-darkcard text-red-400 border border-darkborder hover:border-red-500/50 whitespace-nowrap transition">
          🎸 Rock & Alternativ
        </button>
        <button data-cat="monuments" class="cat-pill px-3 py-1.5 rounded-full font-semibold bg-darkcard text-blue-400 border border-darkborder hover:border-blue-500/50 whitespace-nowrap transition">
          🏛️ Seværdigheder
        </button>
        <button data-cat="tiktok" class="cat-pill px-3 py-1.5 rounded-full font-semibold bg-darkcard text-pink-400 border border-darkborder hover:border-pink-500/50 whitespace-nowrap transition">
          📱 TikTok & Insta
        </button>
        <button data-cat="visited" class="cat-pill px-3 py-1.5 rounded-full font-semibold bg-darkcard text-emerald-400 border border-darkborder hover:border-emerald-500/50 whitespace-nowrap transition">
          ⭐ Besøgt (<span id="visited-counter">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 relative flex flex-col min-h-0 overflow-hidden">
    
    <!-- Map View Container -->
    <div id="view-map" class="w-full flex-1 relative min-h-[400px]">
      <div id="map" class="w-full h-full"></div>
      
      <!-- Floating Map Action: Locate & Recenter -->
      <div class="absolute bottom-20 right-4 z-[500] flex flex-col gap-2">
        <button id="btn-recenter" title="Vis alle spots i Milano" class="w-11 h-11 rounded-2xl bg-darksurface/90 backdrop-blur-md border border-darkborder text-gray-200 hover:text-white shadow-xl flex items-center justify-center text-lg active:scale-95 transition">
          🎯
        </button>
        <button id="btn-hotel-map" title="Gå til vores hotel (Basecamp)" class="w-11 h-11 rounded-2xl bg-amber-500/20 backdrop-blur-md border border-amber-500/50 text-amber-400 shadow-xl flex items-center justify-center text-lg active:scale-95 transition">
          🏨
        </button>
      </div>
    </div>

    <!-- List View Container -->
    <div id="view-list" class="hidden w-full flex-1 overflow-y-auto px-4 py-4 pb-24">
      <div class="max-w-5xl mx-auto space-y-3" id="cards-container">
        <!-- Rendered dynamically -->
      </div>
      <div id="empty-state" class="hidden text-center py-12 space-y-3">
        <div class="text-4xl">🔍</div>
        <p class="text-gray-400 text-sm">Ingen spots matcher din søgning eller filter.</p>
        <button id="btn-reset-filters" class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold">
          Nulstil filtre
        </button>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Sticky Navigation -->
  <nav class="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-darksurface/95 backdrop-blur-md border-t border-darkborder px-4 py-2.5 pb-[calc(0.6rem+env(safe-area-inset-bottom))]">
    <div class="flex items-center justify-around gap-2">
      <button id="mobile-nav-map" class="flex-1 flex flex-col items-center justify-center py-1.5 rounded-xl bg-red-600 text-white font-bold text-xs shadow-md">
        <span class="text-base leading-none mb-0.5">🗺️</span>
        <span>Kort</span>
      </button>
      <button id="mobile-nav-list" class="flex-1 flex flex-col items-center justify-center py-1.5 rounded-xl text-gray-400 hover:text-white font-semibold text-xs">
        <span class="text-base leading-none mb-0.5">📋</span>
        <span>Liste (<span id="mobile-list-count">15</span>)</span>
      </button>
      <button id="mobile-nav-hotel" class="flex-1 flex flex-col items-center justify-center py-1.5 rounded-xl text-amber-400 font-semibold text-xs hover:bg-amber-500/10">
        <span class="text-base leading-none mb-0.5">🏨</span>
        <span>Hotel</span>
      </button>
    </div>
  </nav>

  <!-- Detail Modal / Bottom Sheet -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-card" class="w-full sm:max-w-lg bg-darksurface rounded-t-3xl sm:rounded-3xl border border-darkborder shadow-2xl overflow-hidden max-h-[90dvh] flex flex-col animate-slide-up sm:animate-scale-in">
      
      <!-- Modal Header -->
      <div class="px-5 pt-4 pb-3 border-b border-darkborder flex items-start justify-between gap-3 bg-darkcard/50">
        <div class="space-y-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="modal-category-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider"></span>
            <span id="modal-visited-badge" class="hidden px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
              ✓ Besøgt
            </span>
          </div>
          <h2 id="modal-title" class="text-xl font-bold font-display text-white"></h2>
          <p id="modal-address" class="text-xs text-gray-400 flex items-center gap-1"></p>
        </div>
        <button id="modal-close" class="w-9 h-9 rounded-full bg-darkcard border border-darkborder text-gray-400 hover:text-white flex items-center justify-center text-sm font-bold transition">
          ✕
        </button>
      </div>

      <!-- Modal Body -->
      <div class="px-5 py-4 overflow-y-auto space-y-4 text-sm text-gray-300">
        <div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Hvorfor skal I se det?</h3>
          <p id="modal-desc" class="leading-relaxed text-gray-200"></p>
        </div>

        <div class="rounded-2xl p-3.5 bg-darkcard border border-red-500/20 space-y-1">
          <div class="flex items-center gap-1.5 text-xs font-bold text-red-400 uppercase tracking-wider">
            <span>🔥</span> Insider Tip
          </div>
          <p id="modal-tip" class="text-xs text-gray-300 leading-relaxed"></p>
        </div>

        <!-- Visited toggle in modal -->
        <div class="pt-1">
          <button id="modal-toggle-visited" class="w-full py-2.5 px-4 rounded-xl border border-darkborder bg-darkcard hover:bg-darkborder/50 text-xs font-semibold flex items-center justify-center gap-2 transition">
            <span id="modal-toggle-icon">⭐</span>
            <span id="modal-toggle-text">Marker som besøgt</span>
          </button>
        </div>
      </div>

      <!-- Modal Footer with Directions -->
      <div class="px-5 py-3 border-t border-darkborder bg-darkcard/40 flex items-center gap-2.5 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
        <a id="modal-maps-btn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-600 text-white font-bold text-sm shadow-lg shadow-red-600/30 active:scale-[0.98] transition">
          <span>📍</span> Åbn i Google Maps
        </a>
        <a id="modal-social-btn" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-1.5 py-3 px-4 rounded-xl bg-darkcard border border-darkborder hover:border-gray-500 text-gray-200 font-semibold text-xs transition">
          <span id="modal-social-icon">🔗</span>
          <span id="modal-social-text">Link</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
